# Шаблон конфига atagos. Скопируй в config.yaml и заполни своими значениями.
#   cp config.example.yaml config.yaml
# config.yaml в .gitignore — реальные значения не коммитятся.

company:
  iin: "000000000000"               # ИИН (виден в сертификате ЭЦП)
  tax_payer_type: "UL"              # тип налогоплательщика (форма создания заявки)
  subject_address: "000000"         # код юр.адреса в goszakup
  iik: "0000000"                    # код ИИК в goszakup
  contact_phone: ""                 # контактный телефон (можно пусто)
  consortium: 0

# Бенефициар (Приложение 1) — данные удостоверения личности + PDF для загрузки.
beneficiary:
  name: "Фамилия Имя Отчество"
  citizenship: "398"                # 398 = KZ
  res_country: "398"
  doc_number: "000000000"           # номер удостоверения
  doc_date: "2020-01-01"            # дата выдачи (YYYY-MM-DD)
  options:                          # option_1..option_4 из ajax_save_info
    option_1: 0
    option_2: 0
    option_3: 0
    option_4: 1
  id_pdf_path: "./удлич.pdf"        # PDF удостоверения личности для прикрепления
  # Загрузка PDF идёт через NCALayer (подписанная). Загрузи файл один раз в
  # браузере, возьми его file_id и впиши сюда — бот переиспользует и пропустит
  # загрузку (пусто = пытаться загрузить напрямую).
  id_file_id:

ecp:
  p12_path: "./GOSTKNCA_XXXXXXXX.p12"
  password_keyring_service: "atagos-ecp"
  password_keyring_user: "default"

account:
  # Пароль кабинета goszakup (для шага auth_confirm при логине по ЭЦП).
  password_keyring_service: "atagos-acc"
  password_keyring_user: "default"

# TumarCSP (Гамма Технологии) — локальный провайдер, шифрующий ценовое
# предложение (EncryptOfferPrice). ОБЯЗАТЕЛЕН на машине, где работает бот.
tumarcsp:
  ws_url: "wss://127.0.0.1:6127/tumarcsp/"
  # Лицензионный ключ EFC (SetAPIKey). Снимается из запроса со страницы
  # priceoffers (DevTools → WS 6127 → SetAPIKey → apiKey) и периодически
  # обновляется при истечении срока.
  api_key: "PASTE_TUMARCSP_API_KEY_HERE"
  # Авто-заполнение попапа цены (Windows + pywinauto; pip install pywinauto).
  # true = бот сам вписывает минимум и жмёт OK; при неудаче — ручной ввод.
  autofill_popup: false
  # Резервный путь — абсолютные координаты ЭТОЙ машины. Нужен ТОЛЬКО если окно
  # попапа вообще не находится перечислением (win32). Сначала пробуется обычный
  # win32-режим (без координат, с проверкой). В координатном режиме значение
  # ВСЕГДА сверяется через буфер обмена перед Enter. Снять координаты:
  # `python tools/popup_probe.py` при открытом попапе.
  # popup:
  #   field_xy: [1914, 1011]      # абс. координаты поля ввода цены
  #   ok_xy: [1850, 1075]         # абс. координаты кнопки OK (опц.; иначе Enter)
  #   # ЛИБО относительные смещения от левого-верхнего угла окна (надёжнее —
  #   # переживают сдвиг окна; смещение = абс_координата − rect.topleft из probe):
  #   # field_offset: [240, 150]
  #   # ok_offset: [176, 214]
  #   detect_xy: [1751, 952]      # пиксель фона попапа (ждём появления окна)
  #   detect_rgb: [240, 240, 240] # цвет фона в detect_xy

ncalayer:
  # Не используется в горячем пути (подпись делает Kalkan). Оставлено для справки.
  url: "wss://127.0.0.1:13579/"

goszakup:
  base_url: "https://v3bl.goszakup.gov.kz"
  ci_session_service: "atagos-cookie"

defaults:
  pre_t0_warmup: true
  # Темп проверки открытия (T0). Поллер шлёт запросы ВНАХЛЁСТ (до 3 одновременно),
  # так что это интервал между запусками, а не последовательное ожидание —
  # открытие ловим за ~0.5с. Меньше = агрессивнее (риск рейт-лимита).
  poll_interval_ms: 500
  http_timeout_s: 10
  log_dir: "~/.atagos/logs"
  state_dir: "~/.atagos/state"
  dumping_floor_ratio: 0.80         # d_sum = pl_sum * 0.80 (минимум, который и подаём)
  # Как часто слать «тендер ещё на ожидании» в телеграм, пока ждём открытия.
  waiting_notify_interval_s: 60
  # Как сохранять подписи документов:
  #   serial            — безопасно (по умолчанию): каждое сохранение по очереди с
  #                       GET-барьером, тех.спец последним. Чинит пропажу подписи
  #                       Приложение 1 / Приложение 15.
  #   parallel_sessions — эксперимент (вариант B): каждый документ подписывается в
  #                       СВОЕЙ отдельной сессии (свой логин) и сохраняется
  #                       параллельно. Если docs_next ругнётся — авто-доподпись по
  #                       очереди. Откат = вернуть serial. Сначала проверь с dry_run!
  doc_save_mode: serial

# Telegram-бот — только для `python -m goszakup.bot.atagos_bot`.
telegram:
  # Проще всего: впиши токен от @BotFather прямо сюда.
  bot_token: ""                     # напр. "123456789:AAE...тут_весь_токен"
  # Либо оставь bot_token пустым и держи токен в env-переменной с этим ИМЕНЕМ
  # (PowerShell: $env:TG_BOT_TOKEN = "123456789:AAE..."). НЕ вписывай сам токен
  # в bot_token_env — это ИМЯ переменной, а не токен.
  bot_token_env: TG_BOT_TOKEN
  allowed_user_ids: []              # числовые Telegram user_id с доступом
  admin_user_ids: []                # опционально; получают уведомления о попытках доступа

search:                             # имена параметров = filter[...] из URL поиска goszakup
  statuses:                         # filter[status][]
    - 210      # Опубликовано (приём заявок) — бидим сейчас
    - 220      # Опубликовано — ждём открытия (pre-T0 poll)
  methods:                          # filter[method][] — коды методов закупки (пусто = все)
    - 2        # пример: метод = 2
  # Отдельного "keywords" у goszakup нет — текстовый поиск это filter[name]:
  name_query: ""                    # -> filter[name] (серверный поиск по названию)
  keywords: []                      # наше доп. клиентское сужение по подстроке (пусто = не сужаем)
  trade_type: "r"                   # filter[trade_type]
  default_max_sum: 100000000        # KZT
